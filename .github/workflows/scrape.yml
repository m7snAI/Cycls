# .github/workflows/scrape.yml
# Daily incremental scrape (scrapers/daily.py): الـ active set كله + المنافسات الجديدة،
# بيـ enrich التفاصيل (الغرض + مكان التنفيذ) ويعطّل اللي اختفت. الـ schedule مفعّل.
# الـ backfill التاريخي بيتعمل local عن طريق run_backfill.py (منفصل).
name: Etimad Scrape

on:
  workflow_dispatch:
    inputs:
      request_delay_min:
        description: "Min delay between requests (seconds). Default 4."
        required: false
        default: "4"
      request_delay_max:
        description: "Max delay between requests (seconds). Default 6."
        required: false
        default: "6"
      details_limit:
        description: "Max detail-page fetches per run (caps runtime under the 350m GHA timeout). 0 = no cap."
        required: false
        default: "1000"
  schedule:
    - cron: "0 3 * * *"   # 6am Saudi time (03:00 UTC) — daily incremental: new + active tenders

jobs:
  probe:
    # Quick WAF probe على runner IP قبل ما نضيع 6 ساعات.
    # لو page 100 رجع 400، الـ runner IP في الـ block list؛ بنوقف فوراً.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - name: Probe Etimad pagination
        id: check
        run: |
          set -e
          mkdir -p probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          probe_page100() {
            curl -s -o probe/page100.json -w "%{http_code}" \
              "https://tenders.etimad.sa/Tender/AllSupplierTendersForVisitorAsync?PageNumber=100&PageSize=24&PublishDateId=5" \
              -H "Accept: application/json" \
              -H "X-Requested-With: XMLHttpRequest" \
              -H "Referer: https://tenders.etimad.sa/Tender/AllTendersForVisitor" \
              -H "User-Agent: $UA"
          }
          # A single GHA runner IP is sometimes WAF-blocked for deep pagination
          # while the API itself is fine (page 1 works, page 100 returns 400).
          # Retry a few times with backoff before giving up so one bad IP doesn't
          # skip the whole day's scrape.
          MAX_ATTEMPTS=5
          HTTP=""
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            HTTP=$(probe_page100) || HTTP="000"
            echo "Page 100 attempt $attempt/$MAX_ATTEMPTS returned HTTP $HTTP"
            [ "$HTTP" = "200" ] && break
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep $((attempt * 10))
            fi
          done
          curl -s -o probe/page1.json -w "Page 1 HTTP %{http_code}\n" \
            "https://tenders.etimad.sa/Tender/AllSupplierTendersForVisitorAsync?PageNumber=1&PageSize=24&PublishDateId=5" \
            -H "Accept: application/json" \
            -H "X-Requested-With: XMLHttpRequest" \
            -H "Referer: https://tenders.etimad.sa/Tender/AllTendersForVisitor" \
            -H "User-Agent: $UA"
          if [ "$HTTP" = "200" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "::error::WAF appears to block this runner IP for deep pagination (HTTP $HTTP after $MAX_ATTEMPTS attempts). Probe body:"
            cat probe/page100.json
            exit 1
          fi

      - name: Upload probe responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-responses
          path: probe/
          retention-days: 7

  scrape:
    needs: probe
    if: needs.probe.outputs.passed == 'true'
    runs-on: ubuntu-latest
    # 350 min = just under the 6h hard cap so artifact upload still runs.
    # الـ scrape بياخد ~15 ساعة كاملة؛ هنحتاج عدة runs والـ resume logic بتشيل الباقي.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # `|| '4'` so a scheduled run (where inputs are empty) doesn't pass
          # an empty string the scraper would choke on.
          REQUEST_DELAY_MIN: ${{ inputs.request_delay_min || '4' }}
          REQUEST_DELAY_MAX: ${{ inputs.request_delay_max || '6' }}
          DETAILS_LIMIT: ${{ inputs.details_limit || '1000' }}
        # pipefail so a Python crash fails the job instead of being masked by
        # `tee`'s exit 0 (this hid the daily scraper crashing for days).
        run: |
          set -o pipefail
          python scrapers/daily.py 2>&1 | tee scrape.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs
          path: "*.log"
          retention-days: 14
